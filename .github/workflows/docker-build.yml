name: Docker Build and Push

on:
    push:
        branches: [ "main" ]

jobs:
  build-and-push:
      runs-on: ubuntu-latest

      steps:
        - name: 코드 체크아웃
          uses: actions/checkout@v3

        - name: Docker Hub 로그인
          uses: docker/login-action@v3
          with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Docker 이미지 빌드 및 푸시
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-practice:latest

        - name: EC2 배포
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ubuntu
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cicd-practice:latest
              docker stop cicd-practice || true
              docker rm cicd-practice || true
              docker run -d -p 8080:8080 --name cicd-practice ${{ secrets.DOCKERHUB_USERNAME }}/cicd-practice:latest